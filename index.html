<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calculadora">
<title>Calculadora</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/index.css">
</head>
<body>
<main class="calc" aria-label="Calculadora">
  <div class="display" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-action="clear">AC</button>
    <button class="fn" data-action="back" aria-label="Apagar">⌫</button>
    <button class="fn" data-action="percent">%</button>
    <button class="op" data-op="/">÷</button>
    <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button>
    <button class="op" data-op="*">×</button>
    <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button>
    <button class="op" data-op="-">−</button>
    <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button>
    <button class="op" data-op="+">+</button>
    <button class="fn" data-action="sign">±</button>
    <button data-num="0">0</button>
    <button data-action="dot">,</button>
    <button class="op eq" data-action="equals">=</button>
  </div>
  <div class="history" id="history" aria-label="Histórico"></div>
</main>
<script type="module" src="/index.tsx"></script>
</body>
</html>
